services:
  - type: web
    name: licitaciones-backend
    env: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11